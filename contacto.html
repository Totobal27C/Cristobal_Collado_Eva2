<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="css/style1.css">
</head>

<body>
    <div class="container" style="max-width: 480px; margin: 3rem auto;">
        <div class="card">
            <form id="registroForm">
                <h3>Contacto</h3>
                <input type="text" id="nombre" name="nombre" placeholder="Nombre de usuario">
                <input type="email" id="email" name="email" placeholder="Correo electrónico">
                <label for="mensaje" style="display:none">Mensaje</label>
                <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí..." rows="8"></textarea>
                <button type="submit">Enviar mensaje</button>
                <p id="status"></p>
            </form>
        </div>
    </div>

</body>

</html>
