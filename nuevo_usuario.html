<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f7f7f7
        }

        .card {
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 320px
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #2b7cff;
            box-shadow: 0 0 4px rgba(43, 124, 255, 0.3)
        }

        input.error {
            border-color: #e74c3c !important;
            background: #ffe8e8
        }

        input.valid {
            border-color: #27ae60 !important
        }

        .error-msg {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: -10px;
            margin-bottom: 10px;
            display: none
        }

        .error-msg.show {
            display: block
        }

        .success-msg {
            color: #27ae60;
            font-size: 0.85rem;
            margin-top: -10px;
            margin-bottom: 10px;
            display: none
        }

        .success-msg.show {
            display: block
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            background: #2b7cff;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600
        }

        button:hover {
            background: #1e5cc0
        }

        button:disabled {
            background: #95b3e0;
            cursor: not-allowed
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Iniciar sesión</h2>
        <form id="loginForm">
            <label for="fullname">Nombre completo</label>
            <input type="text" id="fullname" name="fullname" required placeholder="Tu nombre completo">
            <div class="error-msg" id="fullname-error"></div>
            <label for="age">Edad</label>
            <input type="text" id="age" name="age" required placeholder="Tu edad">
            <div class="error-msg" id="age-error"></div>
            <label for="username">Nombre de usuario</label>
            <input type="text" id="username" name="username" required placeholder="Tu nombre">
            <div class="error-msg" id="username-error"></div>

            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" required placeholder="Tu correo electrónico">
            <div class="error-msg" id="email-error"></div>
            <div class="success-msg" id="email-success"></div>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required placeholder="Tu contraseña">
            <div class="error-msg" id="password-error"></div>
            <label for="confirmPassword">Confirmar Contraseña</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirma tu contraseña">
            <div class="error-msg" id="confirmPassword-error"></div>
            <div class="success-msg" id="confirmPassword-success"></div>

            <button type="submit">Entrar</button>
        </form>
    </div>


    <script src="js/Java.js"></script>
</body>

</html>
